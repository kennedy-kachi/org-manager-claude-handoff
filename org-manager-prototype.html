<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>People · Org Health · Perk</title>
  <style>
    @font-face {
      font-family: "Perk Sans"; font-weight: 400; font-style: normal;
      src: url("https://staticassets.perk.com/fonts/PerkSans/PerkSans-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Perk Sans"; font-weight: 500 600; font-style: normal;
      src: url("https://staticassets.perk.com/fonts/PerkSans/PerkSans-Medium.woff2") format("woff2");
    }
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #fafaf5;
      --text: #14140f;
      --text-2: #6e6e64;
      --text-3: #838377;
      --stroke: #e8e8df;
      --stroke-2: #d2d2c8;
      --ink: #14140f;
      --ink-hover: #000000;
      --accent: #14140f;
      --accent-soft: #f0f0e9;
      --will: #cf3049;
      --will-soft: #fff0f2;
      --risk: #ad6900;
      --risk-soft: #fff5df;
      --ok: #087a55;
      --ok-soft: #eaf6ef;
      --warm: #fafaf5;
      --shadow: none;
      --shadow-lg: 0 8px 24px rgba(20,20,15,.14);
      --radius: 8px;
      --radius-lg: 8px;
      --font: "Perk Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --display: var(--font);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --ease: cubic-bezier(.2,.8,.2,1);
      --drawer: min(520px, 94vw);
      --nav-h: 0px;
    }

    * { box-sizing: border-box; }
    html, body, #root { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    kbd {
      font-family: var(--mono); font-size: 10.5px;
      border: 1px solid var(--stroke-2); border-bottom-width: 2px;
      border-radius: 4px; padding: 0 4px; background: var(--surface);
      color: var(--text-2);
    }

    .app { height: 100%; display: flex; flex-direction: column; }

    /* —— Top nav —— */
    .tk-nav {
      height: var(--nav-h); flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--stroke);
      display: flex; align-items: center; gap: 8px;
      padding: 0 20px 0 18px;
      z-index: 10;
    }
    .tk-logo {
      font-weight: 700; font-size: 17px; letter-spacing: -0.04em;
      color: var(--text); text-decoration: none; margin-right: 18px;
      white-space: nowrap;
    }
    .tk-logo span { font-weight: 600; opacity: .55; margin-left: 1px; }
    .tk-links { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
    .tk-link {
      border: 0; background: transparent; color: var(--text-2);
      padding: 8px 10px; border-radius: 6px; font-size: 13.5px; font-weight: 500;
      white-space: nowrap;
      transition: color .15s var(--ease), background .15s var(--ease);
    }
    .tk-link:hover { color: var(--text); background: var(--bg); }
    .tk-link.active { color: var(--text); font-weight: 650; }
    .tk-right { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-shrink: 0; }
    .proto-chip {
      font-size: 11px; color: var(--text-3);
      border: 1px solid var(--stroke); border-radius: 999px;
      padding: 4px 10px; white-space: nowrap;
    }
    .role-switch { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; }
    .role-switch select {
      border: 1px solid var(--stroke-2); border-radius: 6px;
      padding: 5px 8px; background: var(--surface); color: var(--text); font-size: 12px;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #f0c4d4; color: #6b2a42;
      display: grid; place-items: center;
      font-size: 11px; font-weight: 700; position: relative;
    }
    .avatar::after {
      content: ""; position: absolute; top: -1px; right: -1px;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--will); border: 2px solid var(--surface);
    }

    .main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
    .stage {
      flex: 1; overflow: auto;
      padding: 28px max(40px, calc((100% - 1080px) / 2)) 96px;
    }

    /* —— Page head —— */
    .page-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .crumbs { font-size: 12.5px; color: var(--text-3); margin-bottom: 4px; }
    .crumbs button { background: none; border: 0; padding: 0; color: var(--text-3); }
    .crumbs button:hover { color: var(--text); text-decoration: underline; }
    .page-head h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 42px; font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.1;
    }
    .page-head .sub { margin: 8px 0 0; color: var(--text-2); font-size: 14px; max-width: 540px; }
    .page-actions { display: flex; align-items: center; gap: 14px; padding-top: 26px; }
    .link-btn {
      background: none; border: 0; color: var(--text);
      text-decoration: underline; text-underline-offset: 3px;
      font-size: 13px; font-weight: 500; padding: 0;
    }
    .link-btn:hover { color: var(--text-2); }
    .proto-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }

    /* —— L2 card shell —— */
    .l2 {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }
    .l2-tabs {
      display: flex; align-items: center; gap: 0;
      border-bottom: 1px solid var(--stroke);
      padding: 0 8px;
    }
    .l2-tab {
      border: 0; background: transparent; color: var(--text-2);
      padding: 14px 14px; position: relative; font-weight: 500; font-size: 13.5px;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .l2-tab:hover { color: var(--text); }
    .l2-tab.active { color: var(--text); font-weight: 650; }
    .l2-tab.active::after {
      content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px;
      height: 2px; background: var(--ink); border-radius: 2px 2px 0 0;
    }
    .l2-badge {
      background: var(--will); color: #fff;
      font-size: 10px; font-weight: 700;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 999px; display: grid; place-items: center;
    }

    /* Entrance fades were leaving the page blank when the animation never finished. */

    /* —— Overview: score + domain cards —— */
    .overview {
      display: grid;
      grid-template-columns: 1.15fr 1fr 1fr 1fr;
      gap: 10px;
      padding: 20px 20px 4px;
    }
    .ov-card {
      background: var(--surface-2);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 16px;
      text-align: left;
      color: inherit;
      transition: border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
    }
    button.ov-card:hover { border-color: var(--stroke-2); background: var(--surface); box-shadow: var(--shadow); }
    button.ov-card.active { border-color: var(--ink); background: var(--surface); }
    .ov-card.locked { opacity: .7; cursor: not-allowed; }
    .score-card { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; }
    .ring { position: relative; width: 84px; height: 84px; }
    .ring svg { transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 7; }
    .ring .track { stroke: var(--stroke); }
    .ring .val { stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease), stroke .3s; }
    .enter .ring .val { animation: ring-in 1s var(--ease) both; }
    @keyframes ring-in { from { stroke-dashoffset: 226; } }
    .ring-num {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-family: var(--display); font-size: 30px; line-height: 1;
    }
    .score-card h3 { margin: 0; font-size: 14px; font-weight: 650; }
    .score-card .delta { font-size: 12px; color: var(--text-3); margin: 2px 0 8px; }
    .delta.up { color: var(--ok); }
    .scan-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: 0; padding: 0;
      font-size: 12px; color: var(--text-2); font-weight: 500;
    }
    .scan-btn:hover { color: var(--text); }
    .scan-btn svg { width: 13px; height: 13px; }
    .scan-btn.spinning svg { animation: spin .8s linear infinite; }

    .dom-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .dom-head strong { font-size: 13px; font-weight: 650; }
    .dom-head .chev { color: var(--text-3); }
    .dom-label { font-size: 11.5px; color: var(--text-3); }
    .dom-num {
      font-family: var(--display); font-size: 30px; line-height: 1.1; margin: 2px 0 10px;
    }
    .dom-num.zero { color: var(--ok); }
    .bar { height: 5px; border-radius: 999px; background: var(--stroke); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: 999px; background: var(--ok); transition: width .6s var(--ease); }
    .enter .bar i { animation: bar-in .9s var(--ease) both; }
    @keyframes bar-in { from { width: 0; } }
    .dom-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-3); margin-top: 6px; }

    .trust-line {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin: 10px 20px 0; padding: 9px 12px;
      background: var(--warm); border-radius: 7px;
      font-size: 12.5px; color: var(--text-2);
    }
    .trust-line strong { color: var(--text); font-weight: 600; }
    .trust-steps { display: inline-flex; gap: 6px; align-items: center; }
    .trust-steps span { background: var(--surface); border: 1px solid var(--stroke); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; }

    /* —— Status tabs + filter chips (Supabase advisor) —— */
    .list-toolbar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 16px 20px 10px; flex-wrap: wrap;
    }
    .seg {
      display: inline-flex; background: var(--bg); border-radius: 8px; padding: 3px; gap: 2px;
    }
    .seg button {
      border: 0; background: transparent; color: var(--text-2);
      padding: 6px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 550;
      display: inline-flex; gap: 6px; align-items: center;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(17,17,17,.08); }
    .seg .n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--stroke-2); background: var(--surface);
      color: var(--text-2); border-radius: 999px;
      padding: 5px 11px; font-size: 12px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px;
      transition: border-color .15s, color .15s, background .15s;
    }
    .chip:hover { border-color: var(--text-3); color: var(--text); }
    .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .chip .x { opacity: .6; }

    .section-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 650; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-3);
      margin: 10px 20px 6px;
    }
    .section-label .count { font-variant-numeric: tabular-nums; color: var(--text-3); font-weight: 500; }

    /* —— Finding rows (Linear density) —— */
    .rows { padding: 0 10px; }
    .finding {
      display: grid;
      grid-template-columns: 22px 14px minmax(0,1fr) auto auto auto;
      gap: 12px; align-items: center;
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 12px 12px 12px 10px;
      cursor: pointer;
      position: relative;
      transition: background .15s var(--ease), border-color .15s var(--ease), opacity .25s, max-height .3s var(--ease), padding .3s var(--ease), margin .3s;
      max-height: 120px;
      outline: none;
    }
    .finding + .finding { margin-top: 2px; }
    .finding:hover { background: var(--surface-2); }
    .finding.cursor { background: var(--surface-2); border-color: var(--stroke); }
    .finding.selected-row { background: #f5f7f6; }
    .finding.open { border-color: var(--ink); background: var(--surface); }
    .finding.leaving { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin: 0; }
    .cb {
      width: 16px; height: 16px; border-radius: 4px;
      border: 1.5px solid var(--stroke-2); background: var(--surface);
      display: grid; place-items: center; padding: 0;
      opacity: 0; transition: opacity .15s, background .15s, border-color .15s;
    }
    .finding:hover .cb, .finding.cursor .cb, .cb.on, .has-selection .cb { opacity: 1; }
    .cb.on { background: var(--ink); border-color: var(--ink); }
    .cb svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 3; }
    .sev-ico { width: 14px; height: 14px; display: grid; place-items: center; }
    .sev-ico svg { width: 14px; height: 14px; }
    .f-main { min-width: 0; }
    .f-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .f-title h3 {
      margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.012em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .new-dot {
      font-size: 10px; font-weight: 700; color: var(--accent);
      background: var(--accent-soft); border-radius: 999px; padding: 1px 6px;
      flex-shrink: 0;
    }
    .f-sub {
      display: flex; gap: 8px; align-items: center; margin-top: 3px;
      font-size: 12.5px; color: var(--text-2); min-width: 0;
    }
    .f-sub .ev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entity {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px; color: var(--text-2);
      background: var(--bg); border-radius: 5px; padding: 1px 6px;
      white-space: nowrap; flex-shrink: 0;
    }
    .entity svg { width: 11px; height: 11px; }
    .stack { display: flex; align-items: center; }
    .stack .pa {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--surface);
      font-size: 9px; font-weight: 700;
      display: grid; place-items: center; margin-left: -6px;
    }
    .stack .pa:first-child { margin-left: 0; }
    .stack .more { font-size: 11.5px; color: var(--text-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
    .age { font-size: 12px; color: var(--text-3); white-space: nowrap; min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
    .f-actions { display: flex; gap: 4px; align-items: center; }
    .f-actions .btn-ghost { opacity: 0; transition: opacity .15s; }
    .finding:hover .f-actions .btn-ghost, .finding.cursor .f-actions .btn-ghost { opacity: 1; }

    .pill {
      font-size: 11px; font-weight: 600;
      padding: 2px 7px; border-radius: 999px;
      background: var(--bg); color: var(--text-2);
      white-space: nowrap;
    }
    .pill.will { background: var(--will-soft); color: var(--will); }
    .pill.risk { background: var(--risk-soft); color: #8a5a00; }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }

    .list-foot {
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      color: var(--text-3); font-size: 12px;
      border-top: 1px solid var(--stroke); margin-top: 12px;
    }
    .keys { display: inline-flex; gap: 12px; align-items: center; }
    .keys span { display: inline-flex; gap: 4px; align-items: center; }

    /* —— Buttons —— */
    .btn {
      border-radius: 7px; border: 1px solid transparent;
      padding: 8px 14px; font-weight: 600; font-size: 13px;
      display: inline-flex; align-items: center; gap: 6px;
      transition: transform .12s var(--ease), background .15s, border-color .15s, opacity .15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.985); }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: var(--ink-hover); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-secondary { background: var(--surface); border-color: var(--stroke-2); color: var(--text); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-ghost { background: transparent; color: var(--text-2); }
    .btn-ghost:hover { background: var(--bg); color: var(--text); }
    .btn-danger { background: var(--will); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-icon { padding: 6px; }
    .btn-icon svg { width: 16px; height: 16px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* —— Empty / resolved —— */
    .empty { text-align: center; padding: 56px 24px 44px; }
    .empty-ico {
      width: 52px; height: 52px; margin: 0 auto 14px;
      border-radius: 50%; background: var(--ok-soft); color: var(--ok);
      display: grid; place-items: center;
    }
    .empty-ico svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .empty h2 { margin: 0 0 6px; font-family: var(--display); font-size: 28px; font-weight: 400; }
    .empty p { margin: 0; color: var(--text-2); }
    .hist-row {
      display: grid; grid-template-columns: 14px minmax(0,1fr) auto auto; gap: 12px; align-items: center;
      padding: 12px 12px 12px 10px; border-radius: 9px;
    }
    .hist-row:hover { background: var(--surface-2); }
    .hist-row h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--text-2); }
    .hist-row .meta { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .mono { font-family: var(--mono); font-size: 11px; }

    /* —— In-context banner (Vanta People) —— */
    .ctx-banner {
      display: flex; gap: 12px; align-items: flex-start;
      margin: 16px 16px 4px; padding: 14px 16px;
      background: var(--will-soft); border: 1px solid #f7d4d5; border-radius: 10px;
    }
    .ctx-banner svg { width: 18px; height: 18px; color: var(--will); flex-shrink: 0; margin-top: 1px; }
    .ctx-banner strong { display: block; font-size: 13.5px; }
    .ctx-banner p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-2); }
    .ctx-banner .btn { margin-left: auto; flex-shrink: 0; }

    /* —— People table —— */
    .people-table { width: 100%; border-collapse: collapse; }
    .people-table th {
      text-align: left; font-size: 12px; font-weight: 600; color: var(--text-3);
      padding: 12px 16px; border-bottom: 1px solid var(--stroke);
    }
    .people-table td { padding: 12px 16px; border-bottom: 1px solid var(--stroke); vertical-align: middle; }
    .people-table tr:last-child td { border-bottom: 0; }
    .people-table tbody tr:hover td { background: var(--surface-2); }
    .person { display: flex; align-items: center; gap: 10px; }
    .person-av {
      width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 10.5px; font-weight: 700; flex-shrink: 0;
    }
    .person strong { display: block; font-size: 13.5px; font-weight: 600; }
    .person span { font-size: 12px; color: var(--text-3); }
    .issue-chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px;
      border: 0; cursor: pointer;
    }
    .issue-chip.will { background: var(--will-soft); color: var(--will); }
    .issue-chip.risk { background: var(--risk-soft); color: #8a5a00; }
    .issue-chip.hygiene { background: var(--bg); color: var(--text-2); }

    /* —— Bulk bar (Linear / Aboard) —— */
    .bulk {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: var(--ink); color: #fff;
      border-radius: 12px; padding: 6px 6px 6px 14px;
      display: flex; gap: 4px; align-items: center;
      box-shadow: var(--shadow-lg); z-index: 60;
      animation: bulk-in .28s var(--ease);
      font-size: 13px;
    }
    @keyframes bulk-in { from { opacity: 0; transform: translateX(-50%) translateY(12px); } }
    .bulk .sel { font-weight: 600; margin-right: 8px; font-variant-numeric: tabular-nums; }
    .bulk button {
      background: transparent; border: 0; color: #fff; border-radius: 7px;
      padding: 7px 10px; font-size: 12.5px; font-weight: 550;
      display: inline-flex; gap: 6px; align-items: center;
    }
    .bulk button:hover { background: rgba(255,255,255,.12); }
    .bulk .sep { width: 1px; height: 18px; background: rgba(255,255,255,.18); margin: 0 4px; }
    .bulk kbd { background: transparent; color: rgba(255,255,255,.6); border-color: rgba(255,255,255,.25); }

    /* —— Drawer (Sentry / Supabase) —— */
    .scrim {
      position: absolute; inset: 0;
      background: rgba(17,17,17,.18);
      opacity: 0; pointer-events: none;
      transition: opacity .25s var(--ease);
      z-index: 20;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: var(--drawer);
      background: var(--surface);
      border-left: 1px solid var(--stroke);
      box-shadow: var(--shadow-lg);
      transform: translateX(104%);
      transition: transform .32s var(--ease);
      z-index: 30;
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: none; }
    .drawer-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px 10px 20px; border-bottom: 1px solid var(--stroke);
      font-size: 12px; color: var(--text-3);
    }
    .drawer-top .nav { display: flex; gap: 2px; align-items: center; }
    .drawer-head { padding: 18px 20px 14px; }
    .drawer-head .pills { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .drawer h2 {
      margin: 0 0 6px;
      font-family: var(--display);
      font-size: 28px; font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.2;
    }
    .seen { display: flex; gap: 16px; font-size: 12px; color: var(--text-3); }
    .seen b { color: var(--text-2); font-weight: 550; }
    .drawer-body { flex: 1; overflow: auto; padding: 4px 20px 20px; }
    .drawer-foot {
      padding: 12px 20px; border-top: 1px solid var(--stroke);
      background: var(--surface-2);
      display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap;
    }
    .why {
      border-left: 3px solid var(--will);
      background: var(--will-soft);
      padding: 10px 12px; border-radius: 0 8px 8px 0;
      font-size: 13px; margin-bottom: 20px;
    }
    .why.risk { border-color: var(--risk); background: var(--risk-soft); }
    .why.hygiene { border-color: var(--stroke-2); background: var(--bg); }
    .why strong { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); margin-bottom: 2px; }
    .block { margin-bottom: 22px; }
    .block h3 {
      margin: 0 0 10px; font-size: 11px; font-weight: 650;
      letter-spacing: .06em; text-transform: uppercase; color: var(--text-3);
      display: flex; justify-content: space-between; align-items: center;
    }
    .block h3 .link-btn { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--text-2); }
    .props { display: grid; gap: 10px; background: var(--bg); border-radius: 8px; padding: 14px; }
    .prop { display: grid; grid-template-columns: 110px 1fr; gap: 8px; font-size: 13px; align-items: center; }
    .prop dt { color: var(--text-3); }
    .prop dd { margin: 0; font-weight: 500; }
    .aff { border: 1px solid var(--stroke); border-radius: 8px; overflow: hidden; }
    .aff-row {
      display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center;
      padding: 9px 12px; border-bottom: 1px solid var(--stroke); font-size: 13px;
    }
    .aff-row:last-child { border-bottom: 0; }
    .aff-row .cb { opacity: 1; }
    .aff-row .person-av { width: 24px; height: 24px; font-size: 9px; }
    .aff-row .note-r { font-size: 12px; color: var(--text-3); }
    .aff-more { padding: 8px 12px; font-size: 12px; color: var(--text-3); background: var(--surface-2); }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .compare-col {
      border: 1px solid var(--stroke); border-radius: 8px; padding: 12px;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .compare-col.primary { border-color: var(--accent); background: var(--accent-soft); }
    .compare-col h4 { margin: 0 0 8px; font-size: 12px; display: flex; gap: 6px; align-items: center; }
    .field {
      display: flex; justify-content: space-between; gap: 6px;
      font-size: 11px; padding: 4px 0; border-bottom: 1px solid var(--stroke);
    }
    .field:last-child { border-bottom: 0; }
    .field span:last-child { color: var(--text-2); text-align: right; font-family: var(--mono); font-size: 10px; }
    .field.diff span:last-child { color: var(--will); }
    .note { margin-top: 10px; font-size: 12px; color: var(--text-2); background: var(--bg); border-radius: 7px; padding: 10px 12px; }
    .dry {
      border: 1px dashed var(--stroke-2); border-radius: 8px; padding: 12px 14px;
      display: grid; gap: 10px;
    }
    .dry-col h4 { margin: 0 0 4px; font-size: 12px; font-weight: 650; display: flex; gap: 6px; align-items: center; }
    .dry-col ul { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 12.5px; }
    .dry-col li { margin-bottom: 2px; }
    .dry-badge { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; }
    select.inline {
      border: 1px solid var(--stroke-2); border-radius: 7px;
      padding: 8px 10px; background: var(--surface); width: 100%;
    }
    .timeline { display: grid; gap: 0; }
    .tl-item { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 7px 0; position: relative; }
    .tl-item::before {
      content: ""; position: absolute; left: 7px; top: 22px; bottom: -2px;
      width: 1px; background: var(--stroke);
    }
    .tl-item:last-child::before { display: none; }
    .tl-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--stroke-2); background: var(--surface); margin-top: 2px; }
    .tl-dot.on { border-color: var(--accent); background: var(--accent-soft); }
    .tl-item strong { display: block; font-size: 13px; font-weight: 550; }
    .tl-item span { font-size: 12px; color: var(--text-3); }

    /* —— Modal —— */
    .overlay {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(17,17,17,.36);
      backdrop-filter: blur(4px);
      display: grid; place-items: center; padding: 24px;
      animation: fade .2s var(--ease);
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: min(440px, 100%);
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow-lg);
      padding: 22px;
      animation: modal-in .28s var(--ease);
    }
    @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal h2 { margin: 0 0 8px; font-family: var(--display); font-size: 26px; font-weight: 400; letter-spacing: -0.02em; }
    .modal p { margin: 0 0 12px; color: var(--text-2); }
    .modal ul { margin: 0 0 16px; padding-left: 18px; color: var(--text-2); }
    .modal ul li { margin-bottom: 4px; }
    .modal-audit { font-size: 12px; color: var(--text-3); margin: -4px 0 16px; display: flex; gap: 6px; align-items: center; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* —— Toast —— */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: #fff;
      padding: 12px 16px; border-radius: 10px;
      display: flex; gap: 16px; align-items: center;
      z-index: 90; font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: toast-in .35s var(--ease) forwards;
      max-width: min(520px, calc(100vw - 32px));
      overflow: hidden;
    }
    .toast.lift { bottom: 80px; }
    @keyframes toast-in { to { transform: translateX(-50%) translateY(0); } }
    .toast .ok-ico { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; flex-shrink: 0; }
    .toast .ok-ico svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 3; }
    .toast button { background: transparent; border: 0; color: #fff; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; padding: 0; }
    .toast .bar2 { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.15); }
    .toast .bar2 i { display: block; height: 100%; width: 100%; background: rgba(255,255,255,.7); transform-origin: left; animation: toast-bar 5s linear forwards; }
    @keyframes toast-bar { to { transform: scaleX(0); } }

    /* —— Offboarding —— */
    .wizard-wrap { max-width: 640px; margin: 0 auto; }
    .steps { display: flex; gap: 0; margin-bottom: 24px; }
    .step-pip { flex: 1; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-3); position: relative; padding-top: 18px; }
    .step-pip::before { content: ""; position: absolute; top: 5px; left: 0; right: 0; height: 2px; background: var(--stroke); }
    .step-pip:first-child::before { left: 50%; }
    .step-pip:last-child::before { right: 50%; }
    .step-pip span { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; border-radius: 50%; background: var(--stroke-2); border: 2px solid var(--bg); }
    .step-pip.on { color: var(--text); }
    .step-pip.on span { background: var(--ink); }
    .step-pip.done span { background: var(--ok); }
    .wizard { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow); }
    .wizard h1 { margin: 0 0 6px; font-family: var(--display); font-size: 32px; font-weight: 400; letter-spacing: -0.02em; }
    .dep { border: 1px solid var(--stroke); border-radius: 8px; padding: 14px; margin-bottom: 8px; }
    .dep-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .dep select.inline { max-width: 280px; margin-top: 8px; }
    .spinner { width: 28px; height: 28px; margin: 28px auto; border: 2px solid var(--stroke); border-top-color: var(--ink); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .center { text-align: center; padding: 12px 0 8px; color: var(--text-2); }
    .receipt-check { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; background: var(--ok-soft); display: grid; place-items: center; animation: pop .4s var(--ease); }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
    .receipt-check svg { width: 28px; height: 28px; stroke: var(--ok); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .15s var(--ease) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* —— Digest —— */
    .digest-frame { max-width: 540px; background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
    .digest-chrome { background: var(--bg); padding: 10px 16px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--stroke); font-family: var(--mono); }
    .digest-body { padding: 24px; }
    .digest-item { padding: 14px 0; border-bottom: 1px solid var(--stroke); }
    .slack { max-width: 420px; background: #fff; border: 1px solid var(--stroke); border-radius: 10px; padding: 18px; box-shadow: var(--shadow); }

    /* —— Governed AI actions —— */
    .ai-shell {
      display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px;
      align-items: start;
    }
    .ai-card {
      background: var(--surface); border: 1px solid var(--stroke);
      border-radius: var(--radius-lg); box-shadow: var(--shadow);
    }
    .ai-chat { min-height: 620px; display: flex; flex-direction: column; overflow: hidden; }
    .ai-chat-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid var(--stroke);
    }
    .ai-title { display: flex; align-items: center; gap: 9px; font-weight: 650; }
    .ai-mark {
      width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: #fff;
      display: grid; place-items: center; font-family: var(--display); font-size: 18px;
    }
    .ai-thread {
      flex: 1; padding: 28px; display: flex; flex-direction: column; gap: 18px;
      overflow: auto;
    }
    .ai-intro { max-width: 560px; margin: auto; text-align: center; }
    .ai-intro h2 {
      margin: 0 0 8px; font-family: var(--display); font-weight: 400;
      font-size: 32px; letter-spacing: -.02em;
    }
    .ai-intro p { margin: 0 auto 20px; color: var(--text-2); max-width: 480px; }
    .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; }
    .suggestion {
      border: 1px solid var(--stroke); background: var(--surface-2); border-radius: 9px;
      padding: 12px; color: var(--text); font-size: 12.5px; line-height: 1.4;
      transition: border-color .15s, background .15s;
    }
    .suggestion:hover { border-color: var(--stroke-2); background: var(--surface); }
    .suggestion strong { display: block; margin-bottom: 3px; font-size: 12px; }
    .msg { max-width: 78%; }
    .msg.user {
      align-self: flex-end; background: var(--ink); color: #fff;
      padding: 10px 13px; border-radius: 12px 12px 3px 12px;
    }
    .msg.ai { align-self: flex-start; }
    .msg.ai > p { margin: 0; color: var(--text-2); }
    .file-chip {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 8px;
      border: 1px solid var(--stroke); background: var(--surface); border-radius: 8px;
      padding: 8px 10px; color: var(--text); font-size: 12px;
    }
    .file-ico {
      width: 26px; height: 30px; border-radius: 4px; background: var(--ok-soft); color: var(--ok);
      display: grid; place-items: center; font-size: 9px; font-weight: 700;
    }
    .thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); }
    .thinking i, .thinking::before, .thinking::after {
      content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-3);
      animation: think 1.1s infinite ease-in-out;
    }
    .thinking::before { animation-delay: -.2s; }
    .thinking i { animation-delay: -.1s; }
    @keyframes think { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    .composer-wrap { padding: 14px 18px 18px; }
    .composer {
      border: 1px solid var(--stroke-2); border-radius: 12px; background: var(--surface);
      box-shadow: 0 4px 16px rgba(17,17,17,.05); padding: 11px;
    }
    .composer textarea {
      width: 100%; min-height: 52px; max-height: 130px; resize: vertical;
      border: 0; outline: 0; padding: 0; color: var(--text); background: transparent;
      line-height: 1.45;
    }
    .composer-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .composer-tools .left { display: flex; align-items: center; gap: 6px; }
    .attach {
      border: 1px solid var(--stroke); background: var(--surface); border-radius: 7px;
      padding: 6px 9px; font-size: 12px; color: var(--text-2);
    }
    .attach:hover { color: var(--text); background: var(--bg); }
    .attach.on { background: var(--ok-soft); color: var(--ok); border-color: #cfe9dc; }
    .send {
      width: 32px; height: 32px; border-radius: 8px; border: 0;
      background: var(--ink); color: #fff; display: grid; place-items: center;
      font-size: 16px;
    }
    .send:disabled { opacity: .35; cursor: not-allowed; }
    .ai-side { padding: 18px; position: sticky; top: 0; }
    .ai-side h3 { margin: 0 0 12px; font-size: 13px; }
    .guard-step {
      display: grid; grid-template-columns: 24px 1fr; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--stroke);
    }
    .guard-step:last-child { border-bottom: 0; }
    .guard-num {
      width: 22px; height: 22px; border-radius: 50%; background: var(--bg);
      display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--text-2);
    }
    .guard-step strong { display: block; font-size: 12.5px; }
    .guard-step span { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; }

    .ai-review { padding: 20px; }
    .ai-review-head {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
      margin-bottom: 16px;
    }
    .ai-review-head h2 {
      margin: 0 0 5px; font-family: var(--display); font-size: 28px; font-weight: 400;
    }
    .ai-review-head p { margin: 0; color: var(--text-2); max-width: 560px; }
    .scope-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .scope {
      border: 1px solid var(--stroke); background: var(--surface-2);
      border-radius: 8px; padding: 10px 12px;
    }
    .scope span { display: block; color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
    .scope strong { display: block; font-size: 13px; margin-top: 3px; }
    .clarify {
      border: 1px solid #ecd9b7; background: var(--risk-soft); border-radius: 9px;
      padding: 12px; margin-bottom: 16px; font-size: 12.5px;
    }
    .clarify strong { display: block; margin-bottom: 7px; }
    .clarify-options { display: flex; flex-wrap: wrap; gap: 6px; }
    .clarify-options button {
      border: 1px solid #e0c894; background: #fff; border-radius: 999px;
      padding: 5px 9px; color: #6d4e12; font-size: 11.5px;
    }
    .clarify-options button.on { background: #6d4e12; color: #fff; border-color: #6d4e12; }
    .impact-row {
      display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
      border-bottom: 1px solid var(--stroke); padding: 10px 0;
    }
    .impact-row:last-child { border-bottom: 0; }
    .impact-row strong { display: block; font-size: 13px; }
    .impact-row span { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .confirmation-list { display: grid; gap: 8px; margin: 16px 0; }
    .confirm-row {
      display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start;
      border: 1px solid var(--stroke); border-radius: 9px; padding: 11px 12px; cursor: pointer;
    }
    .confirm-row:hover { border-color: var(--stroke-2); }
    .confirm-row input { margin: 2px 0 0; accent-color: var(--ink); }
    .confirm-row strong { display: block; font-size: 13px; }
    .confirm-row span { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .review-actions {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border-top: 1px solid var(--stroke); padding-top: 14px; margin-top: 16px;
    }
    .review-actions .status { font-size: 12px; color: var(--text-3); }
    .run-progress { padding: 60px 28px; text-align: center; }
    .run-progress h2 { font-family: var(--display); font-size: 30px; font-weight: 400; margin: 14px 0 6px; }
    .run-progress p { color: var(--text-2); margin: 0; }
    .result-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 480px; margin: 22px auto; }
    .result-metrics .scope strong { font-family: var(--display); font-size: 26px; font-weight: 400; }
    .result-metrics .scope.bad strong { color: var(--will); }
    .result-metrics .scope.good strong { color: var(--ok); }

    .banner { border-radius: 8px; padding: 10px 12px; margin: 12px 20px 0; font-size: 13px; }
    .banner.info { background: var(--accent-soft); color: var(--accent); }
    .banner.warn { background: var(--risk-soft); color: #8a5a00; }
    .muted { color: var(--text-3); font-size: 12px; }

    @media (max-width: 1000px) {
      .overview { grid-template-columns: 1fr 1fr; }
      .finding { grid-template-columns: 22px 14px minmax(0,1fr) auto; }
      .finding .stack, .finding .age { display: none; }
      .ai-shell { grid-template-columns: 1fr; }
      .ai-side { position: static; }
    }
    @media (max-width: 700px) {
      .stage { padding: 20px 16px 80px; }
      .overview { grid-template-columns: 1fr; }
      .page-head h1 { font-size: 34px; }
      .suggestions, .scope-grid, .result-metrics { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* Staging-derived Perk shell — measured from app.staging-perk.com/people. */
    :root {
      --bg: #fff;
      --surface: #fff;
      --surface-2: #fafaf5;
      --text: #14140f;
      --text-2: #6e6e64;
      --text-3: #838377;
      --stroke: #e8e8df;
      --stroke-2: #d2d2c8;
      --ink: #14140f;
      --ink-hover: #000;
      --accent: #14140f;
      --accent-soft: #f0f0e9;
      --ok: #087a55;
      --ok-soft: #eaf6ef;
      --risk: #ad6900;
      --risk-soft: #fff5df;
      --will: #cf3049;
      --will-soft: #fff0f2;
      --shadow: none;
      --shadow-lg: 0 8px 24px rgba(20,20,15,.14);
      --radius: 8px;
      --radius-lg: 8px;
      --font: "Perk Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --display: var(--font);
      --nav-h: 0px;
    }
    body { font-size: 14px; line-height: 24px; }
    .app { flex-direction: row; }
    .tk-nav {
      width: 248px; height: 100%; flex: 0 0 248px;
      padding: 16px 8px 12px; border: 0; border-right: 1px solid var(--stroke);
      background: #fafaf5; flex-direction: column; align-items: stretch; gap: 2px; z-index: 20;
      overflow: auto;
    }
    .nav-brand { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 14px; }
    .tk-logo {
      width: auto; height: auto; margin: 0; display: flex; align-items: baseline;
      color: var(--text); font-size: 22px; font-weight: 600; letter-spacing: -.04em;
    }
    .tk-logo span { font-weight: 500; margin-left: 1px; }
    .collapse-nav {
      width: 28px; height: 28px; border: 0; background: transparent; color: var(--text-2);
      border-radius: 6px; font-size: 16px;
    }
    .tk-links { width: 100%; flex: 1; flex-direction: column; align-items: stretch; gap: 2px; }
    .nav-parent, .nav-child, .rail-row {

      background: #f0f0e9; color: var(--text-2); font-size: 12px; font-weight: 500; line-height: 1; cursor: help;
    }
    .org-shell .f-sub { margin-top: 2px; gap: 6px; font-size: 13px; line-height: 20px; color: var(--text-2); }
    .org-shell .entity { gap: 4px; padding: 0; background: none; border-radius: 0; font-size: 13px; color: var(--text); }
    .org-shell .entity svg { width: 12px; height: 12px; color: var(--text-3); }
    .f-sep { color: var(--text-3); flex-shrink: 0; }
    .org-shell .f-aff { display: flex; align-items: center; min-width: 0; font-size: 13px; color: var(--text-2); }
    .org-shell .finding .age { display: block; min-width: 0; text-align: left; font-size: 13px; color: var(--text-2); }
    .org-shell .f-actions { justify-content: flex-end; gap: 4px; }
    .org-shell .f-actions .btn-secondary { min-width: 88px; justify-content: center; }
    .org-shell .hist-row { min-height: 65px; padding: 12px 20px; border-radius: 0; border-bottom: 1px solid var(--stroke); }
    .org-shell .list-foot { margin: 0; padding: 12px 20px; border-top: 1px solid var(--stroke-2); font-size: 13px; }

    .tip {
      position: fixed; top: 0; left: 0; z-index: 200; max-width: 260px;
      padding: 8px 10px; border-radius: 8px; background: #14140f; color: #fff;
      font-size: 13px; line-height: 18px; font-weight: 400; text-align: left; white-space: pre-line;
      pointer-events: none; visibility: hidden; opacity: 0; transform: translateY(2px);
      transition: opacity .12s ease, transform .12s ease, visibility 0s linear .12s;
    }
    .tip.on { visibility: visible; opacity: 1; transform: none; transition: opacity .12s ease, transform .12s ease; }

    .org-shell { container-type: inline-size; }
    @container (max-width: 720px) {
      .summary { grid-template-columns: 1fr 1fr; }
      .sum-col:nth-child(3) { border-left: 0; }
      .sum-col:nth-child(n+3) { border-top: 1px solid var(--stroke-2); }
      .list-card { --f-cols: 20px 16px minmax(0, 1fr) 72px 136px; }
      .org-shell .f-aff, .f-head .h-aff { display: none; }
    }
    @container (max-width: 520px) {
      .summary { grid-template-columns: 1fr; }
      .sum-col + .sum-col { border-left: 0; border-top: 1px solid var(--stroke-2); }
      .list-card { --f-cols: 20px 16px minmax(0, 1fr) auto; }
      .org-shell .finding .age, .f-head .h-age { display: none; }
    }

    /* —— Badge text centering ——
       Perk Sans has a tall ascent (0.97em) and short descent (0.21em), so any inherited
       line-height pushes glyphs low. Badges centre a 1em line box with flex instead. */
    .nav-child .count, .l2-badge,
    .avatar, .person-av, .stack .pa, .guard-num,
    .pill, .issue-chip, .new-dot, .proto-tag, .sum-status,
    .trust-steps span, .clarify-options button {
      display: inline-flex; align-items: center; justify-content: center;
      line-height: 1; padding-block: 0; box-sizing: border-box; white-space: nowrap;
    }
    .nav-child .count, .l2-badge {
      flex: none; min-width: 18px; width: auto; height: 18px; padding-inline: 5px;
      border-radius: 999px; background: #df3650; color: #fff;
      font-size: 11px; font-weight: 600; font-variant-numeric: proportional-nums;
    }
    .nav-child .count { margin-left: auto; }
    .avatar, .person-av, .stack .pa, .guard-num { flex-shrink: 0; padding-inline: 0; }
    .pill { height: 20px; }
    .drawer-head .pills { align-items: center; }
    .issue-chip { height: 24px; }
    .new-dot { height: 18px; }
    .org-shell .new-dot { height: 20px; }
    .wizard .pill, .proto-tag { height: 24px; }
    .trust-steps span { height: 20px; }
    .clarify-options button { height: 28px; }
    .chip, .seg button { justify-content: center; line-height: 1; }
    .seg .n, .section-label .count { line-height: 1; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const PEOPLE = {
      maya:  { n: "Maya Chen",     ini: "MC", bg: "#beff50", fg: "#14140f" },
      alex:  { n: "Alex Rivera",   ini: "AR", bg: "#c8a0ff", fg: "#14140f" },
      alex2: { n: "Alex Rivera",   ini: "AR", bg: "#fab9fa", fg: "#14140f" },
      sam:   { n: "Sam Okonkwo",   ini: "SO", bg: "#ff8c5f", fg: "#14140f" },
    };
    const REPORTEES = [
      ["Lena Fischer","LF"],["Tomás Ruiz","TR"],["Aisha Bello","AB"],["Marco Rossi","MR"],
      ["Chloé Martin","CM"],["Jonas Weber","JW"],["Priya Nair","PN"],["Oliver Smith","OS"],

    const TINTS = [["#e6e1f5","#3d2f6b"],["#d9efe7","#1f5040"],["#f5e1e1","#6b2a2a"],["#e1ebf5","#243f63"],["#f3ecd9","#5a4a1c"]];

    const FINDINGS = [
      {
        id: "passport", severity: "will", domain: "people", category: "People",
        title: "Missing passport may block a booking",

      {

    const I = {

      shield: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V7l8-4z"/></svg>`,
      warn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.5"/></svg>`,
      user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>`,
      key: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></svg>`,
      sync: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2M20 4v5h-5M4 20v-5h5"/></svg>`,
      snooze: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3L2 6M19 3l3 3"/></svg>`,
      assign: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6M16 11v6M13 14h6"/></svg>`,
    };
    const sevIco = {
      will: `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--will)"/><path d="M8 4.5v4.2M8 11v.3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>`,
      risk: `<svg viewBox="0 0 16 16"><path d="M8 1.5l7 12.5H1z" fill="var(--risk)"/><path d="M8 6v3.6M8 11.6v.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`,
      hygiene: `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#a8a8a0" stroke-width="2" stroke-dasharray="3 2.2"/></svg>`,
    };

    const state = {
      role: "account",
      view: "list",
      peopleTab: "health",
      status: "open",
      domain: null,
      sevFilter: null,
      newOnly: false,
      findingId: null,
      drawerOpen: false,
      cursor: null,
      selected: new Set(),
      dismissed: new Set(),
      snoozed: new Set(),
      resolved: new Map(),
      modal: null,
      toast: null,
      mergePrimary: "a",
      approverPick: "Jordan Lee",
      reporteePick: new Set(REPORTEES.map((r) => r[0])),
      offStep: "check",
      digestTab: "email",
      scanning: false,
      lastChecked: "2 min ago",
      auditSeq: 2230,
      bulkField: "line",
      bulkStep: "field",
      importStep: "funnel",
      offPolicy: "warn",
      manageOpen: false,
      addOpen: false,
      aiStage: "compose",
      aiScenario: "reassign",
      aiPrompt: "",
      aiAttached: false,
      aiChecks: new Set(),
      aiDateMeaning: "Profile created date",
      aiExecuted: null,
    };

    let enterNext = true;
    let drawerWasOpen = false;
    const ENTER_KEYS = ["view", "peopleTab", "status", "domain", "sevFilter", "newOnly", "role"];

    function esc(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function setState(p) {
      if (ENTER_KEYS.some((k) => k in p && p[k] !== state[k])) enterNext = true;
      Object.assign(state, p);
      render();
    }

    function inScope(f) { return !(state.role === "company" && f.accountOnly); }
    function isOpen(f) { return !state.dismissed.has(f.id) && !state.snoozed.has(f.id) && !state.resolved.has(f.id); }

    function openFindings() { return FINDINGS.filter((f) => inScope(f) && isOpen(f)); }

    function visibleFindings() {
      return openFindings().filter((f) => {
        if (state.domain && f.domain !== state.domain) return false;
        if (state.sevFilter && f.severity !== state.sevFilter) return false;
        if (state.newOnly && !f.isNew) return false;
        return true;
      }).sort((a, b) => ORDER[a.severity] - ORDER[b.severity]);
    }

    function counts() {
      const all = openFindings();
      return {
        will: all.filter((f) => f.severity === "will").length,
        risk: all.filter((f) => f.severity === "risk").length,
        hygiene: all.filter((f) => f.severity === "hygiene").length,
        total: all.length,
        snoozed: FINDINGS.filter((f) => inScope(f) && state.snoozed.has(f.id)).length,
        resolved: FINDINGS.filter((f) => inScope(f) && (state.resolved.has(f.id) || state.dismissed.has(f.id))).length,
      };
    }

    function score() {
      const s = 100 - openFindings().reduce((acc, f) => acc + WEIGHT[f.severity], 0);
      return Math.max(0, s);
    }
    const BASE_SCORE = 100 - FINDINGS.reduce((a, f) => a + WEIGHT[f.severity], 0);

    const WAITING = ["Lena Fischer", "Tomás Ruiz"];
    function waitingPicked() { return WAITING.filter((n) => state.reporteePick.has(n)).length; }
    function waitingCopy(who) {
      const w = waitingPicked();
      return w ? `${w} waiting ${w === 1 ? "request" : "requests"} re-route to ${who}` : "No waiting requests to re-route";
    }

    function affectedCount(f) {
      if (f.affected === "reportees") return state.reporteePick.size || 12;
      return f.affected.length;
    }

    function avatarStack(f) {
      if (f.affectedLabel) return `<div class="stack"><span class="more" style="margin-left:0">${esc(f.affectedLabel)}</span></div>`;
      const list = f.affected === "reportees"
        ? REPORTEES.slice(0, 3).map((r, i) => ({ ini: r[1], bg: TINTS[i][0], fg: TINTS[i][1] }))
        : f.affected.map((k) => PEOPLE[k]);
      const extra = f.affected === "reportees" ? 12 - 3 : 0;
      return `<div class="stack">${list.map((p) => `<span class="pa" style="background:${p.bg};color:${p.fg}">${p.ini}</span>`).join("")}${extra ? `<span class="more">+${extra}</span>` : ""}</div>`;
    }

      const c = counts();
      const inPeople = state.view === "people";
      const inOrg = state.view === "list";

            <nav class="tk-links" aria-label="Primary">

                <div class="page-actions ${inPeople ? "people-page-actions" : inOrg ? "org-page-actions" : ""}">
                  ${inPeople ? `` : opts.actions || `<button type="button" class="btn btn-secondary" data-nav="people">Back to People</button>`}
                </div>
              </div>
              ${inPeople ? `
                <div class="people-toolbar">
                  <label class="people-search-wrap" aria-label="Search people">
                    <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>

                    <button type="button" class="reset-filters" data-toast="Filters reset">Reset filters</button>
                  </div>
                </div>
              ` : ""}
              ${inPeople ? `
                <div class="l2 rise" style="animation-delay:.04s">
                  <div class="l2-tabs" role="tablist">
                    <button type="button" role="tab" class="l2-tab ${state.peopleTab === "active" ? "active" : ""}" data-ptab="active">Active (418)</button>
                    <button type="button" role="tab" class="l2-tab ${state.peopleTab === "invited" ? "active" : ""}" data-ptab="invited">Invited (1)</button>
                    <button type="button" role="tab" class="l2-tab ${state.peopleTab === "archived" ? "active" : ""}" data-ptab="archived">Archived (6)</button>
                  </div>
                  ${opts.banner || ""}
                  <div class="table-card">${inner}</div>
                </div>
              ` : inner}
            </div>
            ${renderDrawer()}
            <div class="scrim ${state.drawerOpen && drawerWasOpen ? "open" : ""}" id="scrim"></div>
          </div>
        </div>
        ${state.selected.size && state.view === "list" ? renderBulk() : ""}
        ${state.modal ? renderModal() : ""}
        ${state.toast ? `<div class="toast ${state.selected.size ? "lift" : ""}" role="status"><span class="ok-ico">${I.check}</span><span>${esc(state.toast.message)}</span>${state.toast.undo ? `<button type="button" id="toastUndo">Undo</button>` : ""}<div class="bar2"><i></i></div></div>` : ""}
      `;
    }

    /* —— Overview —— */
    const DOMAIN_TIP = {
      people: "People profiles and travel documents: passports, duplicate profiles, missing Unique IDs, CSV imports and guest lifecycle. Click to filter the list.",
      structure: "Approval flows and reporting lines, e.g. people who report to an archived approver. Click to filter the list.",
      connections: "Integrations that keep Perk in sync: SSO, SCIM and HRIS. Click to filter the list.",
    };
    const SEV_TIP = {
      will: "Will block: people in these profiles can’t book or sign in until it’s fixed. Fix these first.",
      risk: "At risk: could break approval routing or data, but nothing is blocked yet.",
      hygiene: "Hygiene: cleanup that keeps your data trustworthy. Nothing is broken today.",
    };
    const INTEGRATIONS = [
      { name: "Okta SAML", finding: "sso" },
      { name: "Okta SCIM", finding: "scim" },
    ];
    const HOW_FIXES_WORK = "How fixes work\nEvidence: every issue shows the records behind it.\nDry run: preview what will and won’t change.\nConfirm: nothing is written until you approve.\nAudit + undo: every change gets an audit ID and can be reversed.";
    let lastScanAt = new Date(Date.now() - 2 * 60 * 1000);
    const clock = (d) => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

    function renderOverview() {
      const s = score();
      const c = counts();
      const base = Math.max(0, 100 - FINDINGS.filter(inScope).reduce((a, f) => a + WEIGHT[f.severity], 0));
      const delta = s - base;
      const status = s >= 90 ? ["ok", "Ready"] : s >= 75 ? ["risk", "Needs attention"] : ["will", "At risk"];
      const scoreTip = `Starts at 100. −6 per will-block, −3 per at-risk, −1 per hygiene issue. Right now: ${c.will} will block, ${c.risk} at risk, ${c.hygiene} hygiene. Last full scan ${clock(lastScanAt)}.`;
      const open = openFindings();
      const check = `<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>`;

      const domainCols = DOMAINS.map((d) => {
        if (d.accountOnly && state.role === "company") {
          return `<div class="sum-col locked" tabindex="0" data-tip="Only account admins can see and fix SSO and SCIM issues.">
            <div class="sum-head"><span>${d.label}</span><span class="lock">${I.lock}</span></div>
            <div class="sum-locked">Managed by account admins</div>
            <div class="sum-line">SSO and SCIM issues go to them</div>
          </div>`;
        }
        const items = open.filter((f) => f.domain === d.key);
        const aff = items.reduce((a, f) => a + (f.affectedLabel ? 1 : affectedCount(f)), 0);
        const bad = d.key === "people" ? Math.min(aff, d.total) : items.length;
        const okN = d.total - bad;
        const n = items.length;
        const sevLine = ["will", "risk", "hygiene"].map((k) => {
          const m = items.filter((f) => f.severity === k).length;
          if (!m) return "";
          const on = state.domain === d.key && state.sevFilter === k;
          return `<span class="sev-count ${on ? "on" : ""}" role="button" tabindex="0" data-dsev="${d.key}:${k}" data-tip="${esc(SEV_TIP[k])} Click to show only these.">
            <span class="sdot ${k}"></span>${m} ${SEV[k].toLowerCase()}</span>`;
        }).join("");
        const integLine = d.key === "connections" ? INTEGRATIONS.map((g) => {
          const f = fById(g.finding);
          const broken = f && open.includes(f);
          return `<span class="integ" data-tip="${esc(broken ? `${g.name} · ${f.evidence}` : `${g.name} · healthy`)}">${broken ? `<span class="sdot ${f.severity}"></span>` : check}${g.name}</span>`;
        }).join("") : "";
        const ctx = !n
          ? `<span class="sum-ok">${check}All ${d.total} ${d.unit} OK</span>`
          : okN <= 0 ? `${d.total} of ${d.total} need attention` : `${okN} of ${d.total} ${d.unit} OK`;
        const active = state.domain === d.key;
        return `<div class="sum-col ${active ? "active" : ""} ${n && okN <= 0 ? "failing" : ""}" role="button" tabindex="0"
              aria-pressed="${active}" data-domain="${d.key}" data-tip="${esc(DOMAIN_TIP[d.key])}">
          <div class="sum-head"><span>${d.label}</span><span class="chev">${I.chev}</span></div>
          <div class="sum-num ${n ? "" : "zero"}">${n}</div>
          ${integLine ? `<div class="sum-line">${integLine}</div>` : sevLine ? `<div class="sum-line">${sevLine}</div>` : ""}
          <div class="sum-line">${ctx}</div>
        </div>`;
      }).join("");

      return `
        <div class="summary">
          <div class="sum-col sum-readiness">
            <div class="sum-head"><span class="tip-term" tabindex="0" data-tip="${esc(scoreTip)}">Readiness</span></div>
            <div class="sum-score-row" data-tip="${esc(scoreTip)}">
              <span class="sum-score-num">${s}</span><span class="sum-score-of">/100</span>
              <span class="sum-status ${status[0]}">${status[1]}</span>
            </div>
            ${delta ? `<div class="sum-line ${delta > 0 ? "up" : "down"}">${delta > 0 ? "↑" : "↓"} ${Math.abs(delta)} since you started</div>` : ""}
            <div class="sum-line">
              <span data-tip="Checks run automatically every hour. Last full scan ${clock(lastScanAt)}.">Checked ${state.lastChecked}</span>
              <span class="nowrap"><span class="sep">·</span>
              <button type="button" class="rescan ${state.scanning ? "spinning" : ""}" id="scanNow" ${state.scanning ? "disabled" : ""}
                data-tip="Run every check again now. Takes a few seconds and doesn’t change any data.">${state.scanning ? `${I.refresh}Scanning…` : "Rescan"}</button></span>
            </div>
          </div>
          ${domainCols}
        </div>
        <div class="trust-line">
          ${I.shield}<span>Nothing changes without you — every fix shows evidence, runs a dry run, needs your confirmation, and can be undone.</span>
          <button type="button" class="link-btn trust-link" data-tip="${esc(HOW_FIXES_WORK)}" data-toast="Evidence → Dry run → Confirm → Audit + undo. Nothing is written until you confirm, and every change can be undone.">How fixes work</button>
        </div>
      `;
    }

    /* —— Org Health list —— */
    function renderRow(f, i) {
      const isCursor = state.cursor === f.id;
      const isSel = state.selected.has(f.id);
      const isOpenRow = state.drawerOpen && state.findingId === f.id;
      return `
        <div class="finding rise ${isCursor ? "cursor" : ""} ${isSel ? "selected-row" : ""} ${isOpenRow ? "open" : ""}"
             style="animation-delay:${.12 + i * .04}s" data-open="${f.id}" data-row="${f.id}" tabindex="-1" role="button"
             aria-label="${esc(f.title)}">
          <button type="button" class="cb ${isSel ? "on" : ""}" data-select="${f.id}" aria-label="Select" aria-pressed="${isSel}"
            data-tip="${isSel ? "Remove from selection" : "Select for bulk snooze or assign"} (X)">${isSel ? I.check : ""}</button>
          <span class="sev-ico" data-tip="${esc(SEV_TIP[f.severity])}">${sevIco[f.severity]}</span>
          <div class="f-main">
            <div class="f-title"><h3>${esc(f.title)}</h3>${f.isNew ? `<span class="new-dot" data-tip="First detected in the last 7 days.">New</span>` : ""}</div>
            <div class="f-sub">
              <span class="entity">${I[f.entityIco]}${esc(f.entity)}</span>
              <span class="f-sep">·</span>
              <span class="ev">${esc(f.evidence)}</span>
            </div>
          </div>
          <div class="f-aff" data-tip="${esc(affectedTip(f))}">${avatarStack(f)}</div>
          <span class="age" data-tip="First seen ${ageLong(f.firstSeen)} ago">${f.firstSeen} ago</span>
          <div class="f-actions">
            <button type="button" class="btn btn-ghost btn-sm btn-icon" data-snooze="${f.id}" aria-label="Snooze 7 days"
              data-tip="Snooze for 7 days. It comes back automatically (S)">${I.snooze}</button>
            <button type="button" class="btn btn-secondary btn-sm" data-open="${f.id}" data-tip="${esc(CTA_TIP[f.kind] || "Open the details and evidence.")}">${esc(f.cta)}</button>
          </div>
        </div>`;
    }

    const CTA_TIP = {
      passport: "Ask Maya to add her passport. You preview the request before it’s sent.",
      sso: "See the certificate details and how to renew it before it expires.",
      approver: "Pick a new approver for these 12 people. You’ll see a dry run first.",
      scim: "Open the sync error log and suggested fixes.",
      duplicate: "Compare both profiles side by side and choose which one to keep.",
      "csv-silent": "See which rows didn’t change and why, then re-run them.",
      "guest-travel": "Set a rule so guests with a live trip aren’t archived.",
      "missing-id": "See who is missing a Unique ID and fill it in.",
    };
    function ageLong(a) {
      const n = parseInt(a, 10);
      const unit = { m: "minute", h: "hour", d: "day" }[a.replace(/\d+/g, "")] || "day";
      return `${n} ${unit}${n === 1 ? "" : "s"}`;
    }
    function affectedTip(f) {
      if (f.affectedLabel) return `${f.affectedLabel} affected by this issue`;
      if (f.affected === "reportees") {
        const n = affectedCount(f);
        return `${REPORTEES.slice(0, 3).map((r) => r[0]).join(", ")} and ${n - 3} more report to this approver`;
      }
      return `Affected: ${f.affected.map((k) => PEOPLE[k].n).join(" and ")}`;
    }

    function renderList() {
      const c = counts();
      const findings = visibleFindings();
      const groups = [["will", "Will block"], ["risk", "At risk"], ["hygiene", "Hygiene"]];

      let body = "";
      if (state.status === "open") {
        if (!c.total) {
          body = `<div class="empty rise"><div class="empty-ico">${I.check}</div><h2>Your org is travel-ready</h2><p>We’ll keep checking people, structure, and connections every hour.</p></div>`;
        } else if (!findings.length) {
          body = `<div class="empty rise"><h2>Nothing matches</h2><p><button type="button" class="link-btn" data-clear>Clear filters</button></p></div>`;
        } else {
          let idx = 0;
          for (const [key, label] of groups) {
            const items = findings.filter((f) => f.severity === key);
            if (!items.length) continue;
            body += `<div class="section-label rise"><span class="tip-term" tabindex="0" data-tip="${esc(SEV_TIP[key])}">${label}</span><span class="count">${items.length}</span></div>`;
            body += `<div class="rows">${items.map((f) => renderRow(f, idx++)).join("")}</div>`;
          }
        }
      } else {
        const hist = FINDINGS.filter((f) => inScope(f) && (state.status === "snoozed"
          ? state.snoozed.has(f.id)
          : state.resolved.has(f.id) || state.dismissed.has(f.id)));
        if (!hist.length) {
          body = `<div class="empty rise"><h2>${state.status === "snoozed" ? "Nothing snoozed" : "Nothing resolved yet"}</h2><p class="muted">${state.status === "snoozed" ? "Snoozed findings come back automatically." : "Every fix lands here with its audit ID."}</p></div>`;
        } else {
          body = `<div class="rows">${hist.map((f) => {
            const r = state.resolved.get(f.id);
            const meta = state.status === "snoozed"
              ? "Snoozed by you · returns in 7 days"
              : r ? `${esc(r.what)} · by you · just now · <span class="mono">${r.audit}</span>` : "Dismissed by you · just now";
            return `<div class="hist-row rise">
              <span class="sev-ico">${state.status === "snoozed" ? sevIco[f.severity] : `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--ok)"/><path d="M5 8.2l2 2 4-4.2" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`}</span>
              <div><h3>${esc(f.title)}</h3><div class="meta">${meta}</div></div>
              <span class="pill">${f.category}</span>
              <button type="button" class="btn btn-ghost btn-sm" data-restore="${f.id}">${state.status === "snoozed" ? "Unsnooze" : "Undo"}</button>
            </div>`;
          }).join("")}</div>`;
        }
      }

      const filterChips = state.status === "open" ? `
        <div class="chips">
          ${state.domain ? `<button type="button" class="chip active" data-domain="${state.domain}" data-tip="Remove the ${DOMAINS.find((d) => d.key === state.domain).label} filter">${DOMAINS.find((d) => d.key === state.domain).label} <span class="x">✕</span></button>` : ""}
          ${state.sevFilter && state.sevFilter !== "will" ? `<button type="button" class="chip active" data-sev="${state.sevFilter}" data-tip="Remove the ${SEV[state.sevFilter]} filter">${SEV[state.sevFilter]} <span class="x">✕</span></button>` : ""}
          <button type="button" class="chip ${state.sevFilter === "will" ? "active" : ""}" data-sev="will" data-tip="Show only issues that will stop a booking or sign-in soon.">Will block · ${c.will}</button>
          <button type="button" class="chip ${state.newOnly ? "active" : ""}" data-new data-tip="Show only issues first detected in the last 7 days.">New this week</button>
        </div>` : "";
      const showHead = state.status === "open" && findings.length > 0;

      return shell(`
        <div class="org-shell">
          ${renderOverview()}
          <div class="list-toolbar">
            <div class="seg" role="tablist">
              <button type="button" class="${state.status === "open" ? "active" : ""}" data-status="open" data-tip="Issues that still need action.">Open <span class="n">${c.total}</span></button>
              <button type="button" class="${state.status === "snoozed" ? "active" : ""}" data-status="snoozed" data-tip="Hidden for 7 days, then they come back automatically.">Snoozed <span class="n">${c.snoozed}</span></button>
              <button type="button" class="${state.status === "resolved" ? "active" : ""}" data-status="resolved" data-tip="Fixed or dismissed issues, each with an audit ID you can undo.">Resolved <span class="n">${c.resolved}</span></button>
            </div>
            ${filterChips}
          </div>
          <div class="list-card">
          ${showHead ? `<div class="f-head" aria-hidden="true">
            <span class="h-issue">Issue</span>
            <span class="h-aff"><span class="tip-term" data-tip="The people, rows or records this issue touches.">Affected</span></span>
            <span class="h-age"><span class="tip-term" data-tip="When this issue was first detected.">First seen</span></span>
            <span></span>
          </div>` : ""}
          <div class="list-body ${state.selected.size ? "has-selection" : ""}">${body}</div>
          <div class="list-foot">
            <span class="keys">
              <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
              <span><kbd>↵</kbd> open</span>
              <span><kbd>X</kbd> select</span>
              <span><kbd>S</kbd> snooze</span>
            </span>
            <span>Checks run hourly · ${DOMAINS[0].total} profiles · ${DOMAINS[1].total} approval flows${state.role === "account" ? " · SSO + SCIM" : ""}</span>
          </div>
          </div>
        </div>
      `, {
        title: "Org Manager",
        sub: "Catch silent breakage across people, structure, and connections before a trip fails.",
        actions: `<label class="role-switch" data-tip="Preview the page as another admin role. Company admins don’t see SSO and SCIM issues."><span>View as</span>
              <select id="roleSelect">
                <option value="account" ${state.role === "account" ? "selected" : ""}>Account admin</option>
                <option value="company" ${state.role === "company" ? "selected" : ""}>Company admin</option>
              </select>
            </label>
            <button type="button" class="btn btn-primary" data-nav="automation">Ask Perk</button>`,
      });
    }

    function renderBulk() {
      return `<div class="bulk" role="toolbar" aria-label="Bulk actions">
        <span class="sel">${state.selected.size} selected</span>
        <button type="button" data-bulk="snooze">${I.snooze} Snooze 7d</button>
        <button type="button" data-bulk="assign">${I.assign} Assign owner</button>
        <span class="sep"></span>
        <button type="button" data-bulk="clear">Clear <kbd>Esc</kbd></button>
      </div>`;
    }

    /* —— Drawer —— */
    function fById(id) { return FINDINGS.find((f) => f.id === id); }

    function dryRun(willChange, wontChange) {
      return `<div class="block"><h3>Preview <span class="dry-badge">Dry run</span></h3>
        <div class="dry">
          <div class="dry-col"><h4>Will change</h4><ul>${willChange.map((x) => `<li>${x}</li>`).join("")}</ul></div>
          <div class="dry-col"><h4>Won’t change</h4><ul>${wontChange.map((x) => `<li>${x}</li>`).join("")}</ul></div>
        </div></div>`;
    }

    function activity(items) {
      return `<div class="block"><h3>Activity</h3><div class="timeline">
        ${items.map(([t, s, on]) => `<div class="tl-item"><div class="tl-dot ${on ? "on" : ""}"></div><div><strong>${t}</strong><span>${s}</span></div></div>`).join("")}
      </div></div>`;
    }

    function drawerContent(f) {
      if (f.accountOnly && state.role === "company") {
        return { body: `<div class="banner warn" style="margin:0">This finding needs an account admin.</div>`, foot: "" };
      }
      let body = "", foot = "";

      if (f.kind === "passport") {
        body = `
          <div class="block"><h3>Affected traveler</h3>
            <div class="aff">
              <div class="aff-row" style="grid-template-columns:24px 1fr auto">
                <span class="person-av" style="background:${PEOPLE.maya.bg};color:${PEOPLE.maya.fg}">MC</span>
                <div><strong style="font-weight:600">Maya Chen</strong><div class="note-r">maya.chen@acme.com · Design</div></div>
                <span class="pill will">Departs in 6d</span>
              </div>
            </div>
          </div>
          <div class="block"><h3>Evidence</h3>
            <dl class="props" style="margin:0">
              <div class="prop"><dt>Missing</dt><dd>Passport / travel document</dd></div>
              <div class="prop"><dt>Trip</dt><dd>London → Berlin (BER) · 6 Oct</dd></div>
              <div class="prop"><dt>Carrier needs</dt><dd>Document for ticketing</dd></div>
            </dl>
          </div>
          ${dryRun(["Maya gets an email + in-app task to add her passport", "You’re notified when it’s added"], ["Maya’s trip and booking", "Her profile — she enters it herself"])}
          ${activity([["Finding opened", "Profile gap scored against upcoming trip · 2 min ago", true], ["Trip booked", "Berlin · 8 days ago"]])}`;
        foot = `<button type="button" class="btn btn-ghost btn-sm" data-snooze="${f.id}">${I.snooze} Snooze</button>
          <div class="btn-row"><button type="button" class="btn btn-secondary" data-toast="Would open Maya’s profile">Open profile</button>
          <button type="button" class="btn btn-primary" data-confirm="request">Request from Maya</button></div>`;
      } else if (f.kind === "approver") {
        const shown = REPORTEES.slice(0, 6);
        body = `
          <div class="block"><h3>Evidence</h3>
            <dl class="props" style="margin:0">
              <div class="prop"><dt>Archived</dt><dd>Sam Okonkwo · 3 days ago</dd></div>
              <div class="prop"><dt>Approval flow</dt><dd>EU Managers — dual approval</dd></div>
              <div class="prop"><dt>Stalled now</dt><dd>2 trip requests waiting</dd></div>
            </dl>
          </div>
          <div class="block"><h3>Affected travelers · ${state.reporteePick.size} of 12 selected <button type="button" class="link-btn" data-allrep>${state.reporteePick.size === 12 ? "Clear" : "Select all"}</button></h3>
            <div class="aff">
              ${shown.map(([n, ini], i) => {
                const on = state.reporteePick.has(n);
                const t = TINTS[i % TINTS.length];
                return `<div class="aff-row">
                  <button type="button" class="cb ${on ? "on" : ""}" data-rep="${esc(n)}" aria-pressed="${on}">${on ? I.check : ""}</button>
                  <div class="person"><span class="person-av" style="background:${t[0]};color:${t[1]}">${ini}</span><span style="color:var(--text);font-size:13px">${n}</span></div>
                  <span class="note-r">${i < 2 ? "Request waiting" : "No pending trips"}</span>
                </div>`;
              }).join("")}
              <div class="aff-more">+ 6 more travelers</div>
            </div>
          </div>
          <div class="block"><h3>New approver</h3>
            <select class="inline" id="approverSelect">
              ${["Jordan Lee", "Priya Shah", "Chris Ng"].map((n) => `<option ${state.approverPick === n ? "selected" : ""}>${n}</option>`).join("")}
            </select>
          </div>
          ${dryRun([`${state.reporteePick.size} travelers → approver ${state.approverPick}`, waitingCopy(state.approverPick)], ["Past approvals and audit history", "Sam stays archived"])}
          ${activity([["Finding opened", "Detected after Sam was archived · 1 day ago", true], ["Sam Okonkwo archived", "by Chris Ng · 3 days ago"]])}`;
        foot = `<button type="button" class="btn btn-ghost btn-sm" data-snooze="${f.id}">${I.snooze} Snooze</button>
          <div class="btn-row"><button type="button" class="btn btn-secondary" data-confirm="remove-ap">Remove from flow</button>
          <button type="button" class="btn btn-primary" data-confirm="reassign" ${state.reporteePick.size ? "" : "disabled"}>Reassign ${state.reporteePick.size}</button></div>`;
      } else if (f.kind === "duplicate") {
        body = `
          <div class="block"><h3>Pick the profile to keep</h3>
            <div class="compare">
              ${[["a", "alex.rivera@acme.com", "Manual invite", "7", "Jan 2023"], ["b", "a.rivera@acme.com", "SSO just-in-time", "2", "Aug 2026"]].map(([k, em, src, trips, since]) => `
                <label class="compare-col ${state.mergePrimary === k ? "primary" : ""}">
                  <h4><input type="radio" name="primary" value="${k}" ${state.mergePrimary === k ? "checked" : ""}/> ${state.mergePrimary === k ? "Keep" : "Merge into other"}</h4>
                  <div class="field"><span>Name</span><span>Alex Rivera</span></div>
                  <div class="field diff"><span>Email</span><span>${em}</span></div>
                  <div class="field"><span>Unique ID</span><span>E-10482</span></div>
                  <div class="field diff"><span>Source</span><span>${src}</span></div>
                  <div class="field"><span>Trips</span><span>${trips}</span></div>
                  <div class="field"><span>Since</span><span>${since}</span></div>
                </label>`).join("")}
            </div>
