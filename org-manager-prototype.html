    function animateOut(ids, then) {
      ids.forEach((id) => document.querySelector(`[data-row="${id}"]`)?.classList.add("leaving"));
      const d = document.querySelector(".drawer.open");
      if (d) { d.classList.remove("open"); document.getElementById("scrim")?.classList.remove("open"); }
      setTimeout(then, 280);
    }

    function finish(id, what, message, undoable = true) {
      const audit = nextAudit();
      state.modal = null;
      render();
      animateOut([id], () => {
        state.resolved.set(id, { what, audit });
        state.selected.delete(id);
        state.drawerOpen = false;
        state.findingId = null;
        showToast(`${message} · ${audit}`, undoable ? () => { state.resolved.delete(id); } : null);
      });
    }

    function snooze(ids) {
      animateOut(ids, () => {
        ids.forEach((id) => { state.snoozed.add(id); state.selected.delete(id); });
        if (ids.includes(state.findingId)) { state.drawerOpen = false; state.findingId = null; }
        showToast(ids.length > 1 ? `${ids.length} findings snoozed for 7 days` : "Snoozed for 7 days", () => ids.forEach((id) => state.snoozed.delete(id)));
      });
    }

    function openFinding(id) {
      setState({ view: "list", peopleTab: "health", status: "open", findingId: id, drawerOpen: true, cursor: id });
    }

    function closeDrawer() {
      const d = document.querySelector(".drawer");
      d?.classList.remove("open");
      document.getElementById("scrim")?.classList.remove("open");
      setTimeout(() => setState({ drawerOpen: false }), 260);
    }

    function stepFinding(dir) {
      const list = visibleFindings();
      if (!list.length) return;
      const cur = state.drawerOpen ? state.findingId : state.cursor;
      let i = list.findIndex((f) => f.id === cur);
      i = i < 0 ? 0 : Math.min(list.length - 1, Math.max(0, i + dir));
      const id = list[i].id;
      if (state.drawerOpen) setState({ findingId: id, cursor: id });
      else {
        setState({ cursor: id });
        document.querySelector(`[data-row="${id}"]`)?.scrollIntoView({ block: "nearest" });
      }
    }

    function runScan() {
      setState({ scanning: true });
      setTimeout(() => {
        state.scanning = false;
        state.lastChecked = "just now";
        lastScanAt = new Date();
        showToast(`Checked ${DOMAINS[0].total} profiles, ${DOMAINS[1].total} approval flows${state.role === "account" ? ", 2 connections" : ""} · no new findings`);
      }, 1400);
    }

    /* —— Render —— */
    function render() {
      const stage = document.querySelector(".stage");
      const dBody = document.querySelector(".drawer-body");
      const scroll = stage ? stage.scrollTop : 0;
      const dScroll = dBody ? dBody.scrollTop : 0;
      const sameFinding = dBody && state.drawerOpen && render._lastFinding === state.findingId;

      let html;
      if (state.view === "list") html = renderList();
      else if (state.view === "people") html = state.peopleTab === "health" ? renderList() : renderPeople();
      else if (state.view === "offboarding") html = renderOffboarding();
      else if (state.view === "digest") html = renderDigest();
      else if (state.view === "automation") html = renderAutomation();
      else if (state.view === "bulk") html = renderBulkEdit();
      else if (state.view === "import") html = renderImport();
      else html = renderList();

      const root = document.getElementById("root");
      hideTip();
      root.innerHTML = html;
      root.classList.toggle("enter", enterNext);

      const newStage = document.querySelector(".stage");
      if (newStage) newStage.scrollTop = enterNext && render._lastView !== state.view ? 0 : scroll;
      const newDBody = document.querySelector(".drawer-body");
      if (newDBody && sameFinding) newDBody.scrollTop = dScroll;

      if (state.drawerOpen && !drawerWasOpen) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          document.querySelector(".drawer")?.classList.add("open");
          document.getElementById("scrim")?.classList.add("open");
        }));
      }
      drawerWasOpen = state.drawerOpen;
      render._lastFinding = state.findingId;
      render._lastView = state.view;
      enterNext = false;
      bind();
    }

    function bind() {
      const $$ = (sel, fn) => document.querySelectorAll(sel).forEach((n) => n.addEventListener("click", (e) => { e.stopPropagation(); fn(n, e); }));

      const role = document.getElementById("roleSelect");
      if (role) role.onchange = (e) => setState({ role: e.target.value, drawerOpen: false, domain: null, selected: new Set() });

      $$("[data-nav]", (n, e) => {
        e.preventDefault();
        const v = n.getAttribute("data-nav");
        state.manageOpen = false;
        state.addOpen = false;
        if (v === "org-health") setState({ view: "list", peopleTab: "health", status: "open", drawerOpen: false, findingId: null });
        else if (v === "people") setState({ view: "people", peopleTab: "active", drawerOpen: false });
        else if (v === "offboarding") {
          setState({ view: "offboarding", offStep: "check", drawerOpen: false });
          setTimeout(() => { if (state.view === "offboarding" && state.offStep === "check") setState({ offStep: "deps" }); }, 1300);
        } else if (v === "digest") setState({ view: "digest", drawerOpen: false });
        else if (v === "automation") setState({ view: "automation", drawerOpen: false });
        else if (v === "bulk") setState({ view: "bulk", bulkStep: "field", drawerOpen: false });
        else if (v === "import") setState({ view: "import", importStep: "funnel", drawerOpen: false });
      });
      $$("[data-manage-toggle]", () => setState({ manageOpen: !state.manageOpen, addOpen: false }));
      $$("[data-add-toggle]", () => setState({ addOpen: !state.addOpen, manageOpen: false }));
      $$("[data-bulk-step]", (n) => setState({ bulkStep: n.getAttribute("data-bulk-step") }));
      $$("[data-import-step]", (n) => setState({ importStep: n.getAttribute("data-import-step") }));

      $$("[data-ptab]", (n) => {
        const t = n.getAttribute("data-ptab");
        state.manageOpen = false;
        state.addOpen = false;
        if (t === "health") setState({ view: "list", peopleTab: "health", drawerOpen: false });
        else setState({ view: "people", peopleTab: t, drawerOpen: false, selected: new Set() });
      });

      $$("[data-domain]", (n) => {
        const d = n.getAttribute("data-domain");
        setState({ domain: state.domain === d ? null : d, status: "open" });
      });
      $$("[data-sev]", (n) => { const s = n.getAttribute("data-sev"); setState({ sevFilter: state.sevFilter === s ? null : s }); });
      $$("[data-dsev]", (n) => {
        const [d, s] = n.getAttribute("data-dsev").split(":");
        const same = state.domain === d && state.sevFilter === s;
        setState({ domain: same ? null : d, sevFilter: same ? null : s, status: "open" });
      });
      document.querySelectorAll('.summary [role="button"]').forEach((n) => n.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        e.preventDefault();
        e.stopPropagation();
        n.click();
      }));
      $$("[data-new]", () => setState({ newOnly: !state.newOnly }));
      $$("[data-clear]", () => setState({ domain: null, sevFilter: null, newOnly: false }));
      $$("[data-status]", (n) => setState({ status: n.getAttribute("data-status"), selected: new Set() }));

      $$("[data-open]", (n) => openFinding(n.getAttribute("data-open")));
      $$("[data-select]", (n) => {
        const id = n.getAttribute("data-select");
        const s = new Set(state.selected);
        s.has(id) ? s.delete(id) : s.add(id);
        setState({ selected: s, cursor: id });
      });
      $$("[data-bulk]", (n) => {
        const a = n.getAttribute("data-bulk");
        if (a === "clear") setState({ selected: new Set() });
        else if (a === "snooze") snooze([...state.selected]);
        else if (a === "assign") { const k = state.selected.size; setState({ selected: new Set() }); showToast(`${k} findings assigned to Jordan Lee`); }
      });

      $$("[data-snooze]", (n) => snooze([n.getAttribute("data-snooze")]));
      $$("[data-dismiss]", (n) => {
        const id = n.getAttribute("data-dismiss");
        animateOut([id], () => {
          state.dismissed.add(id);
          state.drawerOpen = false; state.findingId = null;
          showToast("Marked not a duplicate — we won’t flag this pair again", () => state.dismissed.delete(id));
        });
      });
      $$("[data-restore]", (n) => {
        const id = n.getAttribute("data-restore");
        state.snoozed.delete(id); state.resolved.delete(id); state.dismissed.delete(id);
        setState({});
        showToast("Moved back to Open");
      });
      $$("[data-confirm]", (n) => openConfirm(n.getAttribute("data-confirm")));
      $$("[data-toast]", (n) => showToast(n.getAttribute("data-toast")));
      $$("[data-step]", (n) => stepFinding(Number(n.getAttribute("data-step"))));
      $$("[data-rep]", (n) => {
        const name = n.getAttribute("data-rep");
        const s = new Set(state.reporteePick);
        s.has(name) ? s.delete(name) : s.add(name);
        setState({ reporteePick: s });
      });
      $$("[data-allrep]", () => setState({ reporteePick: state.reporteePick.size === 12 ? new Set() : new Set(REPORTEES.map((r) => r[0])) }));

      $$("[data-off]", (n) => setState({ offStep: n.getAttribute("data-off") }));
      $$("[data-digest-tab]", (n) => setState({ digestTab: n.getAttribute("data-digest-tab") }));
      $$("[data-digest-cta]", () => setState({ view: "list", peopleTab: "health", status: "open", newOnly: true, drawerOpen: false }));

      $$("[data-ai-example]", (n) => {
        const scenario = n.getAttribute("data-ai-example");
        const prompt = scenario === "csv"
          ? "Hey, I’m onboarding these employees using this CSV."
          : "Reassign all employees created within 6 months in the Design department to line manager John Doe.";
        setState({ aiScenario: scenario, aiPrompt: prompt, aiAttached: scenario === "csv" });
      });
      $$("[data-ai-attach]", () => setState({ aiAttached: true, aiScenario: "csv", aiPrompt: state.aiPrompt || "Hey, I’m onboarding these employees using this CSV." }));
      $$("[data-ai-remove]", () => setState({ aiAttached: false }));
      $$("[data-ai-send]", () => {
        const text = (document.getElementById("aiPrompt")?.value || state.aiPrompt).trim();
        if (!text) return;
        const scenario = /csv|onboard|import|upload/i.test(text) ? "csv" : "reassign";
        setState({ aiPrompt: text, aiScenario: scenario, aiAttached: scenario === "csv" ? state.aiAttached : false, aiStage: "analyzing", aiChecks: new Set() });
        setTimeout(() => {
          if (state.view === "automation" && state.aiStage === "analyzing") setState({ aiStage: "review" });
        }, 1400);
      });
      $$("[data-ai-edit]", () => setState({ aiStage: "compose", aiChecks: new Set() }));
      $$("[data-ai-date]", (n) => setState({ aiDateMeaning: n.getAttribute("data-ai-date"), aiChecks: new Set([...state.aiChecks].filter((i) => i !== 0)) }));
      $$("[data-ai-execute]", () => {
        const audit = "AI-" + (++state.auditSeq);
        setState({ aiStage: "running", aiExecuted: audit });
        setTimeout(() => {
          if (state.view === "automation" && state.aiStage === "running") setState({ aiStage: "done" });
        }, 1500);
      });
      $$("[data-ai-reset]", () => setState({
        aiStage: "compose", aiPrompt: "", aiAttached: false, aiChecks: new Set(),
        aiScenario: "reassign", aiExecuted: null, aiDateMeaning: "Profile created date",
      }));

      const aiPrompt = document.getElementById("aiPrompt");
      if (aiPrompt) aiPrompt.oninput = (e) => {
        state.aiPrompt = e.target.value;
        const send = document.querySelector("[data-ai-send]");
        if (send) send.disabled = !state.aiPrompt.trim();
      };
      document.querySelectorAll("[data-ai-check]").forEach((n) => n.addEventListener("change", () => {
        const i = Number(n.getAttribute("data-ai-check"));
        const checks = new Set(state.aiChecks);
        n.checked ? checks.add(i) : checks.delete(i);
        setState({ aiChecks: checks });
      }));

      const scan = document.getElementById("scanNow");
      if (scan) scan.onclick = runScan;

      document.querySelectorAll('input[name="primary"]').forEach((n) => n.addEventListener("change", () => setState({ mergePrimary: n.value })));
      document.querySelectorAll('input[name="bulkField"]').forEach((n) => n.addEventListener("change", () => setState({ bulkField: n.value })));
      document.querySelectorAll('input[name="offPolicy"]').forEach((n) => n.addEventListener("change", () => setState({ offPolicy: n.value })));
      const ap = document.getElementById("approverSelect");
      if (ap) ap.onchange = () => setState({ approverPick: ap.value });

      const close = document.getElementById("closeDrawer");
      if (close) close.onclick = closeDrawer;
      const scrim = document.getElementById("scrim");
      if (scrim) scrim.onclick = closeDrawer;

      const cancel = document.getElementById("modalCancel");
      if (cancel) cancel.onclick = () => setState({ modal: null });
      const confirm = document.getElementById("modalConfirm");
      if (confirm) { confirm.onclick = () => state.modal?.onConfirm(); confirm.focus(); }
      const overlay = document.getElementById("modalOverlay");
      if (overlay) overlay.addEventListener("click", (e) => { if (e.target === overlay) setState({ modal: null }); });

      const tu = document.getElementById("toastUndo");
      if (tu && state.toast?.undo) tu.onclick = () => { state.toast.undo(); state.toast = null; setState({}); };
    }

    document.addEventListener("keydown", (e) => {
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (state.modal) {
        if (e.key === "Escape") setState({ modal: null });
        else if (e.key === "Enter") { e.preventDefault(); state.modal.onConfirm(); }
        return;
      }
      if (e.key === "Escape") {
        if (state.drawerOpen) closeDrawer();
        else if (state.selected.size) setState({ selected: new Set() });
        return;
      }
      if (state.view !== "list" || state.status !== "open") return;
      if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); stepFinding(1); }
      else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); stepFinding(-1); }
      else if (e.key === "Enter" && state.cursor && !state.drawerOpen) { e.preventDefault(); openFinding(state.cursor); }
      else if ((e.key === "x" || e.key === "X") && state.cursor) {
        const s = new Set(state.selected);
        s.has(state.cursor) ? s.delete(state.cursor) : s.add(state.cursor);
        setState({ selected: s });
      } else if ((e.key === "s" || e.key === "S") && (state.drawerOpen ? state.findingId : state.cursor)) {
        snooze([state.drawerOpen ? state.findingId : state.cursor]);
      }
    });

    /* —— Tooltips: one fixed element on <body> so overflow:hidden containers can't clip it —— */
    const tipEl = document.createElement("div");
    tipEl.className = "tip";
    tipEl.id = "tip";
    tipEl.setAttribute("role", "tooltip");
    document.body.appendChild(tipEl);
    let tipTarget = null;
    let tipTimer = null;

    function showTip(el, delay) {
      if (el === tipTarget) return;
      hideTip();
      tipTarget = el;
      tipTimer = setTimeout(() => {
        if (!el.isConnected) return;
        tipEl.textContent = el.getAttribute("data-tip");
        const r = el.getBoundingClientRect();
        const t = tipEl.getBoundingClientRect();
        let top = r.top - t.height - 8;
        if (top < 8) top = r.bottom + 8;
        const left = Math.max(8, Math.min(r.left + r.width / 2 - t.width / 2, window.innerWidth - t.width - 8));
        tipEl.style.top = `${top}px`;
        tipEl.style.left = `${left}px`;
        tipEl.classList.add("on");
        el.setAttribute("aria-describedby", "tip");
      }, delay);
    }
    function hideTip() {
      clearTimeout(tipTimer);
      tipEl.classList.remove("on");
      tipTarget?.removeAttribute("aria-describedby");
      tipTarget = null;
    }
    document.addEventListener("mouseover", (e) => {
      const el = e.target.closest?.("[data-tip]");
      if (el) showTip(el, 350);
      else if (tipTarget) hideTip();
    });
    document.addEventListener("focusin", (e) => {
      const el = e.target.closest?.("[data-tip]");
      if (el && e.target.matches(":focus-visible")) showTip(el, 150);
      else hideTip();
    });
    document.addEventListener("focusout", hideTip);
    document.addEventListener("scroll", hideTip, true);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });

    render();
  </script>
</body>
</html>
